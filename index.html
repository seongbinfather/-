<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청주 찐맛집 검증 플랫폼</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 16px; }
    header { border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; color: #0f172a; }
    .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    button.btn-search { padding: 10px 16px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
    .chip { padding: 6px 12px; background: #f1f5f9; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid #e2e8f0; white-space: nowrap; }
    .chip.active { background: #2563eb; color: white; border-color: #2563eb; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; transition: transform 0.1s; }
    .card:hover { transform: translateY(-2px); }
    .badge-verified { display: inline-block; background: #dbeafe; color: #1d4ed8; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
    .badge-gov { display: inline-block; background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    .rate-bar-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .rate-bar-fill { height: 100%; background: #2563eb; }
    .stats { display: flex; justify-content: space-between; font-size: 12px; color: #475569; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>청주 맛집 검증 플랫폼</h1>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="식당명 또는 동네 (예: 복대동, 삼겹살)" onkeyup="filterList()">
      <button class="btn-search" onclick="filterList()">검색</button>
    </div>

    <div class="filters">
      <div class="chip active" onclick="setFilter('all', this)">전체</div>
      <div class="chip" onclick="setFilter('verified', this)">맛집 인증 (5점 90%↑)</div>
      <div class="chip" onclick="setFilter('gov', this)">청주시 모범음식점</div>
    </div>

    <div id="restaurantList"></div>
  </div>

  <script>
    const restaurants = [
      { name: "삼포집 복대점", area: "복대동", category: "육류/고기", total: 45, fiveStar: 42, isGov: true },
      { name: "성안길 파스타공방", area: "성안길", category: "양식", total: 30, fiveStar: 28, isGov: false },
      { name: "율량 정통순대국", area: "율량동", category: "한식", total: 20, fiveStar: 15, isGov: true },
      { name: "지웰 해물칼국수", area: "복대동", category: "면류", total: 18, fiveStar: 17, isGov: false }
    ];

    let currentFilter = 'all';

    function renderList(list) {
      const container = document.getElementById('restaurantList');
      container.innerHTML = '';

      if(list.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:30px 0;">검색 결과가 없습니다.</p>';
        return;
      }

      list.forEach(item => {
        const ratio = Math.round((item.fiveStar / item.total) * 100);
        const isVerified = ratio >= 90 && item.total >= 10;

        let badges = '';
        if (isVerified) badges += '<span class="badge-verified">★ 5점 ' + ratio + '% 맛집 인증</span> ';
        if (item.isGov) badges += '<span class="badge-gov">청주시 모범음식점</span>';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = 
          '<div>' + badges + '</div>' +
          '<div class="card-title">' + item.name + '</div>' +
          '<div class="card-sub">' + item.area + ' · ' + item.category + '</div>' +
          '<div class="rate-bar-bg"><div class="rate-bar-fill" style="width:' + ratio + '%;"></div></div>' +
          '<div class="stats">' +
            '<span>별점 5점 비율 <strong>' + ratio + '%</strong></span>' +
            '<span>리뷰 ' + item.total + '개</span>' +
          '</div>';
        container.appendChild(card);
      });
    }

    function filterList() {
      const text = document.getElementById('searchInput').value.toLowerCase();
      let filtered = restaurants.filter(r => r.name.toLowerCase().includes(text) || r.area.toLowerCase().includes(text) || r.category.toLowerCase().includes(text));

      if (currentFilter === 'verified') {
        filtered = filtered.filter(r => Math.round((r.fiveStar / r.total) * 100) >= 90);
      } else if (currentFilter === 'gov') {
        filtered = filtered.filter(r => r.isGov);
      }

      renderList(filtered);
    }

    function setFilter(type, elem) {
      currentFilter = type;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      elem.classList.add('active');
      filterList();
    }

    renderList(restaurants);
  </script>
</body>
</html>
